; PlatformIO Project Configuration File
; Беспроводной датчик CO2 (SenseAir K22 I2C + nRF24L01+), см. Readme.md
;
; Выбор платы = выбор окружения (env). Каждое окружение передаёт свой -DBOARD_xxx,
; вся распиновка - в "CO2_Sensor_NRF24/include/config.h".
;   pio run -e es3c28p          - ESP32-S3 Ai Xiaozhi ES3C28P (2.8" ILI9341V + тач FT6336G)
;   pio run -e tdisplay_s3      - LILYGO T-Display-S3 (1.9" ST7789, 8-бит параллельная шина)
; После сборки firmware.bin + bootloader/partitions копируются в Build/<env>/ (Scripts/copy_firmware.py).

[platformio]
src_dir = CO2_Sensor_NRF24/src
include_dir = CO2_Sensor_NRF24/include
lib_dir = CO2_Sensor_NRF24/lib
test_dir = CO2_Sensor_NRF24/test
default_envs = es3c28p

[env]
; pioarduino - форк платформы с Arduino-ESP32 3.x (официальная espressif32 7.x поставляет только 2.0.17)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
lib_deps =
    nrf24/RF24 @ 1.6.2
    lovyan03/LovyanGFX @ 1.2.32
    olikraus/U8g2 @ 2.36.18     ; только шрифты с кириллицей (*_t_cyrillic) для LovyanGFX
; -fpack-struct НЕ используется глобально: ломает ABI ESP-IDF. Упаковка - только
; __attribute__((packed)) у радиопакета (см. radio.h).
build_flags =
    -Os
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM               ; Arduino 3.x: PSRAM включает сборка qio_opi (CONFIG_SPIRAM); флаг проверяют библиотеки (LovyanGFX: PNG в PSRAM)
; -Wstrict-aliasing=1 (требование проекта) - только для кода проекта (build_src_flags):
; LovyanGFX, U8g2 и фреймворк дают тысячи предупреждений о приведении указателей (чтение из PROGMEM).
build_src_flags =
    -Wstrict-aliasing=1
extra_scripts =
    pre:Scripts/build_web.py
    pre:Scripts/build_info.py      ; дата сборки -> include/build_info.h (FW_BUILD_DATE)
    post:Scripts/copy_firmware.py

[env:es3c28p]
; ESP32-S3R8 + Flash 8 МБ (подтверждено владельцем)
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_ES3C28P

[env:tdisplay_s3]
; ESP32-S3R8 + Flash 16 МБ (Docs/LILYGO T-Display ESP32-S3.png)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_TDISPLAY_S3
